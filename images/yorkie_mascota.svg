<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">

  <!-- Capa trasera, ondeando detrás del cuerpo -->
  <path d="M100,190 C40,260 40,420 90,460 L310,460 C360,420 360,260 300,190
           C270,235 130,235 100,190 Z"
        fill="#A83246" stroke="#F0C452" stroke-width="5" stroke-linejoin="round"/>

  <!-- Cuerpo -->
  <ellipse cx="200" cy="350" rx="105" ry="95" fill="#8A8AAE"/>

  <!-- Patas delanteras -->
  <ellipse cx="150" cy="435" rx="30" ry="24" fill="#E0A868"/>
  <ellipse cx="250" cy="435" rx="30" ry="24" fill="#E0A868"/>

  <!-- Pecho/panza tan -->
  <ellipse cx="200" cy="365" rx="58" ry="68" fill="#E0A868"/>

  <!-- Capa frontal (la que trae el escudo), prendida al cuello -->
  <path d="M140,255 C140,300 150,360 200,375 C250,360 260,300 260,255
           C230,275 170,275 140,255 Z"
        fill="#A83246" stroke="#F0C452" stroke-width="5" stroke-linejoin="round"/>

  <!-- Broche/moño dorado que cierra la capa en el cuello -->
  <circle cx="200" cy="258" r="14" fill="#F0C452" stroke="#2E0854" stroke-width="2"/>

  <!-- Escudo heráldico sobre la capa -->
  <g transform="translate(200,320)">
    <path d="M-32,-38 L32,-38 L32,4 C32,30 0,48 0,48 C0,48 -32,30 -32,4 Z"
          fill="#FBF3E0" stroke="#F0C452" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cruz de la pata dentro del escudo -->
    <path d="M-6,-24 L6,-24 L6,-10 L20,-10 L20,2 L6,2 L6,16 L-6,16 L-6,2 L-20,2 L-20,-10 L-6,-10 Z"
          fill="#A83246"/>
  </g>

  <!-- Cabeza -->
  <circle cx="200" cy="195" r="88" fill="#8A8AAE"/>

  <!-- Orejas -->
  <path d="M120,150 L95,70 L165,125 Z" fill="#8A8AAE"/>
  <path d="M280,150 L305,70 L235,125 Z" fill="#8A8AAE"/>
  <path d="M126,142 L110,90 L162,128 Z" fill="#E0A868"/>
  <path d="M274,142 L290,90 L238,128 Z" fill="#E0A868"/>

  <!-- Flequillo/cara tan -->
  <ellipse cx="200" cy="220" rx="55" ry="46" fill="#E0A868"/>

  <!-- Moño clásico Yorkie en la cabeza -->
  <g transform="translate(200,108)">
    <path d="M0,0 L-26,-14 L-26,14 Z" fill="#F0C452"/>
    <path d="M0,0 L26,-14 L26,14 Z" fill="#F0C452"/>
    <circle cx="0" cy="0" r="8" fill="#A83246"/>
  </g>

  <!-- Ojos -->
  <circle cx="172" cy="195" r="10" fill="#2B2B3D"/>
  <circle cx="228" cy="195" r="10" fill="#2B2B3D"/>
  <circle cx="175" cy="191" r="3" fill="#FBF3E0"/>
  <circle cx="231" cy="191" r="3" fill="#FBF3E0"/>

  <!-- Nariz -->
  <ellipse cx="200" cy="228" rx="10" ry="7" fill="#2B2B3D"/>

  <!-- Boca -->
  <path d="M200,235 Q185,250 172,240 M200,235 Q215,250 228,240"
        fill="none" stroke="#2B2B3D" stroke-width="3" stroke-linecap="round"/>

</svg>
